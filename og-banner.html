<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>OG Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px; height: 630px;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        
        /* Decorative background elements */
        .glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255,0,80,0.4) 0%, rgba(0,0,0,0) 70%); top: -150px; left: -100px; border-radius: 50%; }
        .glow-2 { position: absolute; width: 800px; height: 800px; background: radial-gradient(circle, rgba(0,242,254,0.3) 0%, rgba(0,0,0,0) 70%); bottom: -300px; right: -200px; border-radius: 50%; }
        
        /* Glass card */
        .card {
            width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 35px;
            padding: 55px 70px;
            display: flex;
            flex-direction: row;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3);
            position: relative;
            z-index: 10;
        }
        
        /* Left Column (Avatar & Name) */
        .col-left {
            display: flex; flex-direction: column; align-items: center;
            padding-right: 60px;
            border-right: 1px solid rgba(255,255,255,0.15);
        }
        
        .avatar {
            width: 240px; height: 240px; border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        .handle { font-size: 46px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; background: linear-gradient(90deg, #fff, #ddd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        
        /* Right Column (Stats & Socials) */
        .col-right {
            padding-left: 70px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 45px 35px;
            margin-bottom: 55px;
        }
        
        .stat-item { display: flex; flex-direction: column; }
        .stat-val { font-size: 52px; font-weight: 800; line-height: 1; margin-bottom: 8px; color: #fff; text-shadow: 0 2px 15px rgba(0,0,0,0.4); }
        .stat-label { font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 1px; }
        
        /* Socials */
        .socials {
            display: flex; gap: 22px;
        }
        .social-icon {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .social-icon.tiktok { background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0844); }
        .social-icon.ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .social-icon.yt { background: #FF0000; }
        .social-icon.fb { background: #1877F2; }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    
    <div class="card">
        <div class="col-left">
            <img src="avatar.webp" alt="avatar" class="avatar">
            <h1 class="handle">xyz.taimo</h1>
            <p class="tagline">TikTok Sound Promotions</p>
        </div>
        
        <div class="col-right">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-val">815K</div>
                    <div class="stat-label">Followers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">50.9M</div>
                    <div class="stat-label">Likes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">120+</div>
                    <div class="stat-label">Collabs</div>
                </div>
            </div>
            
            <div class="socials">
                <div class="social-icon tiktok"><i class="fa-brands fa-tiktok"></i></div>
                <div class="social-icon ig"><i class="fa-brands fa-instagram"></i></div>
                <div class="social-icon yt"><i class="fa-brands fa-youtube"></i></div>
                <div class="social-icon fb"><i class="fa-brands fa-facebook-f"></i></div>
            </div>
        </div>
    </div>
</body>
</html>
