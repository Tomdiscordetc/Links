<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>OG Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px; height: 630px;
            font-family: 'Inter', sans-serif;
            /* Starry background */
            background-color: #0d0d12;
            background-image: url('bg-custom.webp');
            background-size: cover;
            background-position: center;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            position: relative;
        }
        
        /* Glows optional but we'll remove them for the clean square look */
        
        /* Dark square card in the middle */
        .card {
            width: 450px;
            background: #111; /* Solid dark color */
            border-radius: 20px;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .avatar {
            width: 160px; height: 160px; border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            background: #000;
        }
        
        .handle { font-size: 34px; font-weight: 800; margin-bottom: 5px; color: #fff; letter-spacing: -0.5px; }
        .tagline { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; }
        
        .stats-row {
            display: flex; align-items: center; justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            width: 100%;
        }
        
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-size: 30px; font-weight: 800; color: #fff; margin-bottom: 3px; }
        .stat-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
        .stat-divider { width: 1px; height: 40px; background: rgba(255,255,255,0.1); }
        
        .socials {
            display: flex; gap: 18px;
            justify-content: center;
            width: 100%;
        }
        .social-icon {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="avatar.webp" alt="avatar" class="avatar">
        <h1 class="handle">xyz.taimo</h1>
        <p class="tagline">TikTok Sound Promotions</p>
        
        <div class="stats-row">
            <div class="stat">
                <div class="stat-val">815K</div>
                <div class="stat-label">Followers</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat">
                <div class="stat-val">50.9M</div>
                <div class="stat-label">Likes</div>
            </div>
        </div>
        
        <div class="socials">
            <div class="social-icon"><i class="fa-brands fa-tiktok"></i></div>
            <div class="social-icon"><i class="fa-brands fa-instagram"></i></div>
            <div class="social-icon"><i class="fa-brands fa-youtube"></i></div>
            <div class="social-icon"><i class="fa-brands fa-facebook-f"></i></div>
        </div>
    </div>
</body>
</html>
