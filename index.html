<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xyz.taimo | TikTok Sound Promotions</title>
    <meta name="description" content="Professional TikTok Sound Promotions & International Collaborations. 815K+ Followers. Business inquiries welcome.">

    <!-- OpenGraph / Discord / WhatsApp Preview Meta Tags -->
    <meta property="og:title" content="xyz.taimo | TikTok Sound Promotions">
    <meta property="og:description" content="Click here for Business Inquiries, Viral Sounds, and International Collaborations. 815K+ Followers.">
    <meta property="og:image" content="https://tomdiscordetc.github.io/Links/og-image.jpg">
    <meta property="og:url" content="https://tomdiscordetc.github.io/Links/">
    <meta property="og:type" content="website">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">

    <!-- Favicons -->
    <link rel="icon" href="avatar.webp" type="image/webp">
    <link rel="apple-touch-icon" href="avatar.webp">

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="xyz.taimo | TikTok Sound Promotions">
    <meta name="twitter:description" content="Click here for Business Inquiries, Viral Sounds, and International Collaborations. 815K+ Followers.">
    <meta name="twitter:image" content="https://tomdiscordetc.github.io/Links/og-image.jpg">

    <!-- Archivo, self-hosted: no third party request -->
    <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="style.css" as="style">
    <link rel="stylesheet" href="style.css">

    <!-- Runs before first paint: avoids a flash of the wrong theme / of the intro -->
    <script>
        (function () {
            var STORE = 'xyztaimo_linkpage_v1';
            try {
                var t = localStorage.getItem(STORE + '_theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (localStorage.getItem(STORE + '_fx') === '0') {
                    document.documentElement.setAttribute('data-fx', 'off');
                }
                if (sessionStorage.getItem(STORE + '_intro')) {
                    document.documentElement.classList.add('intro-done');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        html.intro-done #intro { display: none; }
    </style>
</head>

<body>
<div id="root" data-fx="on"
     style="min-height:100vh;background:var(--color-bg);color:var(--color-text);position:relative;isolation:isolate;background-size:cover;background-position:center;background-attachment:fixed">

    <!-- Mouse spotlight -->
    <div aria-hidden="true" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1">
        <div id="spot" data-spot=""
             style="position:absolute;top:0;left:0;width:620px;height:620px;margin:-310px 0 0 -310px;opacity:0;background:radial-gradient(circle,color-mix(in srgb,var(--color-accent) 15%,transparent) 0%,transparent 62%);transition:opacity .5s ease;will-change:transform"></div>
    </div>

    <!-- Film grain + custom cursor -->
    <div aria-hidden="true" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:60">
        <div id="grain" data-grain="" style="position:absolute;inset:0;opacity:.05"></div>
        <div id="ring" data-cursor=""
             style="position:absolute;top:0;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--color-text);display:none;opacity:0;transition:opacity .3s ease;will-change:transform;mix-blend-mode:difference"></div>
        <div id="dot" data-cursor=""
             style="position:absolute;top:0;left:0;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--color-accent);display:none;opacity:0;transition:opacity .3s ease;will-change:transform"></div>
    </div>

    <!-- ── Intro ─────────────────────────────────────────────────────── -->
    <div id="intro"
         style="position:fixed;inset:0;z-index:90;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;padding:32px;animation:fadein .3s ease">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;position:absolute;top:0;left:0;right:0;padding:24px 32px;border-bottom:2px solid var(--color-divider)">
            <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)"><span data-bind="handle">xyz.taimo</span> — recent work</span>
            <button type="button" class="btn js-skip" data-magnet=""
                    style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:2px 0;color:var(--ink-2)">Skip</button>
        </div>
        <div id="intro-row" data-introrow=""
             style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:760px;width:100%;margin:0 auto"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:24px 32px;border-top:2px solid var(--color-divider);display:flex;justify-content:space-between;align-items:center;gap:16px">
            <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)">Enter, or press Esc</span>
            <button type="button" data-magnet="" class="btn btn-primary js-skip"
                    style="letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:12px 22px">Enter site</button>
        </div>
    </div>

    <!-- ── Shell ─────────────────────────────────────────────────────── -->
    <div data-shell="" style="display:grid;grid-template-columns:minmax(300px,368px) 1fr;max-width:1560px;margin:0 auto;position:relative;z-index:2">

        <aside data-rail="" data-pad="" data-scroll=""
               style="position:sticky;top:0;height:100vh;overflow-y:auto;border-right:2px solid var(--color-divider);padding:38px 34px;display:flex;flex-direction:column;gap:26px">

            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
                <div data-tilt="" style="width:96px;height:96px;overflow:hidden;background:var(--color-surface);border:1px solid var(--hair)">
                    <img id="avatar" src="avatar.webp" alt="xyz.taimo" class="grayscale" style="width:100%;height:100%;object-fit:cover">
                </div>
                <div style="display:flex;gap:2px">
                    <button type="button" id="theme-btn" title="Theme" aria-label="Toggle theme" class="btn btn-secondary btn-icon" data-magnet="" style="border-color:var(--color-divider)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path id="theme-icon" d=""></path></svg>
                    </button>
                    <button type="button" id="fx-btn" title="Effects" aria-label="Toggle effects" class="btn btn-secondary btn-icon" data-magnet="" style="border-color:var(--color-divider)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 3l1.5 4.5L19 9l-4.5 1.5L13 15l-1.5-4.5L7 9l4.5-1.5z"></path></svg>
                    </button>
                </div>
            </div>

            <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                    <span style="width:6px;height:6px;background:var(--color-accent);animation:pulseDot 2.4s ease-in-out infinite"></span>
                    <span data-bind="availability" style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)"></span>
                </div>
                <h1 id="handle" style="font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1;margin:0 0 8px">xyz.taimo</h1>
                <p data-bind="tagline" style="margin:0;font-size:14px;line-height:1.5;color:var(--ink-2);max-width:30ch"></p>
            </div>

            <div data-statrow="" style="display:flex;gap:28px;padding:16px 0;border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)">
                <div>
                    <div data-bind="stat1Num" style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1"></div>
                    <div data-bind="stat1Label" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-top:4px"></div>
                </div>
                <div>
                    <div data-bind="stat2Num" style="font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1"></div>
                    <div data-bind="stat2Label" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-top:4px"></div>
                </div>
            </div>

            <div id="socials" style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px"></div>

            <div data-box="" style="border:1px solid var(--color-divider);padding:14px;display:flex;flex-direction:column;gap:10px">
                <div style="display:flex;align-items:center;gap:10px">
                    <button type="button" id="play-btn" aria-label="Play or pause" class="btn btn-primary btn-icon" data-magnet="" data-playbtn="" style="width:38px;height:38px;flex:none">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path id="play-icon" d="M8 5l12 7-12 7z"></path></svg>
                    </button>
                    <div style="min-width:0;flex:1">
                        <div data-bind="musicTitle" style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
                        <div data-bind="musicArtist" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)"></div>
                    </div>
                    <span id="time" style="font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums">0:00</span>
                </div>
                <div id="track" data-track="" style="height:3px;background:var(--color-divider);cursor:pointer">
                    <div id="fill" style="height:100%;width:0%;background:var(--color-accent)"></div>
                </div>
                <input type="range" id="volume" min="0" max="1" step="0.02" aria-label="Volume" style="width:100%;accent-color:var(--color-accent)">
                <p id="music-msg" style="margin:0;font-size:11px;line-height:1.4;color:var(--color-accent);display:none"></p>
            </div>

            <div style="margin-top:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px">
                <span data-bind="footerLeft"></span>
                <button type="button" id="edit-btn" class="btn" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:0;color:var(--ink-2)">Edit</button>
            </div>
        </aside>

        <main data-pad="" style="padding:0 0 80px;min-width:0;display:flex;flex-direction:column">
            <div style="overflow:hidden;border-bottom:2px solid var(--color-divider);padding:12px 0">
                <div id="marquee" data-marq=""
                     style="display:flex;gap:44px;width:max-content;animation:marq 34s linear infinite;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);will-change:transform"></div>
            </div>

            <section data-pad="" style="padding:64px 54px 54px;border-bottom:2px solid var(--color-divider);order:1">
                <span data-rv="" data-bind="heroKicker" style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent)"></span>
                <h2 data-rv="" data-hero-h1="" data-bind="heroTitle" style="font-size:clamp(38px,4.6vw,66px);font-weight:800;letter-spacing:-.035em;line-height:.98;margin:14px 0 0;max-width:16ch;text-wrap:balance"></h2>
                <p data-rv="" data-bind="heroBody" style="margin:20px 0 0;font-size:16px;line-height:1.55;color:var(--ink-2);max-width:52ch;text-wrap:pretty"></p>
                <div data-rv="" style="display:flex;flex-wrap:wrap;gap:2px;margin-top:32px">
                    <button type="button" data-magnet="" class="btn btn-primary js-inquiry" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;gap:12px">
                        <span data-bind="ctaPrimary"></span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
                    </button>
                    <button type="button" data-magnet="" data-bind="ctaSecondary" class="btn btn-secondary js-work" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;border-color:var(--color-divider)"></button>
                </div>
            </section>

            <section id="sec-links" data-pad="" style="padding:54px 54px;border-bottom:2px solid var(--color-divider);order:2">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px">
                    <h3 style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0">Links</h3>
                    <span id="link-count" style="font-size:11px;letter-spacing:.14em;color:var(--ink-2)"></span>
                </div>
                <div id="links-grid" data-grid2="" style="display:grid;grid-template-columns:repeat(2,1fr);gap:2px"></div>
            </section>

            <section id="sec-work" data-pad="" style="padding:54px 54px;border-bottom:2px solid var(--color-divider);order:3">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px">
                    <h3 style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0">Selected results</h3>
                    <button type="button" class="btn btn-ghost js-work" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase">All work</button>
                </div>
                <div id="vidstrip" data-vidstrip="" style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px"></div>
            </section>

            <section id="sec-cta" data-pad="" style="padding:54px 54px;order:4">
                <div data-box="" style="border:2px solid var(--color-divider);padding:40px 36px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px">
                    <div>
                        <h3 data-bind="closeTitle" style="font-size:clamp(26px,3vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;max-width:20ch"></h3>
                        <p data-bind="closeBody" style="margin:14px 0 0;font-size:14px;color:var(--ink-2);max-width:44ch"></p>
                    </div>
                    <button type="button" data-magnet="" class="btn btn-primary js-inquiry" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;gap:12px">
                        <span data-bind="ctaPrimary"></span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;margin-top:28px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)">
                    <span data-bind="footerLeft"></span>
                    <span data-bind="footerRight"></span>
                </div>
            </section>
        </main>
    </div>

    <!-- Overlays (inquiry / work / login / admin) are built here by script.js -->
    <div id="modal-root"></div>
</div>

<noscript>
    <div style="padding:32px;max-width:640px;margin:0 auto">
        <h1>xyz.taimo</h1>
        <p>TikTok sound promotion and international collaborations.</p>
        <ul>
            <li><a href="https://tiktok.com/@xyz.taimo">TikTok</a></li>
            <li><a href="https://www.instagram.com/xyz.taimo">Instagram</a></li>
            <li><a href="https://www.youtube.com/@xyz_taimo">YouTube</a></li>
            <li><a href="https://www.facebook.com/profile.php?id=61590058673601">Facebook</a></li>
        </ul>
    </div>
</noscript>

<script src="script.js"></script>
</body>
</html>
